<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R4VTZT5PE7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-R4VTZT5PE7');
    </script>

    <meta http-equiv="refresh" content="2; url=https://vbverse.com/">
    <title>VBVerse</title>
</head>

<body>
    <p>Redirecting to VBVerse...</p>
    <script>
        (function () {
            var redirected = false;
            function goToVBVerse() {
                if (redirected) return;
                redirected = true;
                window.location.replace("https://vbverse.com/");
            }
            gtag('event', 'redirect_to_vbverse', {
                event_callback: goToVBVerse,
                event_timeout: 1000
            });
            setTimeout(goToVBVerse, 1000);
        })();
    </script>
</body>

</html>

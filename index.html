<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sylens — Movie Charades</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #17132b, #30205c);
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px 24px;
            max-width: 500px;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 12px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            opacity: 0.85;
        }

        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.12);
        }
    </style>
</head>

<body>

<div class="container">
    <div class="logo">SYLENS</div>

    <h1>Coming Soon to iPhone</h1>

    <p>
        Sylens is currently making its way to the App Store.
        We'll be ready for you soon!
    </p>

    <div class="badge">
        🎬 Movie Charades
    </div>
</div>

<script>
    const androidUrl =
        "https://play.google.com/store/apps/details?id=com.coderdoniv.sylens";

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;

    const isAndroid = /android/i.test(userAgent);

    if (isAndroid) {
        window.location.replace(androidUrl);
    }
</script>

</body>
</html>
